<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background-image: linear-gradient(rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.82)),
                url("https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=1920&q=80");
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }
    </style>
    <title>Gestión de clientes</title>
</head>
<body>
    <h1>Registro de clientes</h1>

    <p th:if="${mensaje}" th:text="${mensaje}" role="status"></p>
    <p th:if="${error}" th:text="${error}" role="alert"></p>

    <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
        <label for="id_cliente">ID del cliente</label>
        <input id="id_cliente" type="text" class="form-control" th:field="*{id_cliente}" required>

        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" class="form-control"   th:field="*{nombre}" required>

        <label for="telefono">Teléfono</label>
        <input id="telefono" type="text"   class="form-control"   th:field="*{telefono}" required>

        <label for="correo">Correo</label>
        <input id="correo" type="email"  class="form-control"  th:field="*{correo}" required>

        <button class="btn btn-success" type="submit">Guardar</button>
    </form>

    <h2>Clientes registrados</h2>
    <table class="table table-bordered-dark">
        <thead>
            <tr>
                <th>ID del cliente</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.id_cliente}"></td>
                <td th:text="${c.nombre}"></td>
                <td th:text="${c.telefono}"></td>
                <td th:text="${c.correo}"></td>
                <td>
                    <a class="btn btn-light" th:href="@{/clientes/editar/{id}(id=${c.id_cliente})}">Editar</a>
                    <form th:action="@{/clientes/eliminar/{id}(id=${c.id_cliente})}" method="post">
                        <button class="btn btn-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(clientes)}">
                <td colspan="5">No hay clientes registrados.</td>
            </tr>
        </tbody>
    </table>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
