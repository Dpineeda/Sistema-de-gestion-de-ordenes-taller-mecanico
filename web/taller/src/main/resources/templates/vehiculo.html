<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background-image: linear-gradient(rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.82)),
                url("https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=1920&q=80");
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }
    </style>
    <title>Gestión de vehículos</title>
</head>
<body>
    <h1>Registro de vehículos</h1>
    <p><a class="btn btn-light" th:href="@{/vehiculos/historial}">Consultar historial por placa</a></p>

    <p th:if="${mensaje}" th:text="${mensaje}" role="status"></p>
    <p th:if="${error}" th:text="${error}" role="alert"></p>

    <form th:action="@{/vehiculos/guardar}" th:object="${vehiculo}" method="post">
        <input type="hidden" th:field="*{id_vehiculo}">

        <label for="placa">Numero de placa</label>
        <input id="placa" type="text" class="form-control" th:field="*{placa}" required>
 
        <label for="marca">Marca del vehículo</label>
        <input id="marca" type="text" class="form-control" th:field="*{marca}" required>

        <label for="modelo">Modelo del vehículo</label>
        <input id="modelo" type="text" class="form-control" th:field="*{modelo}" required>

        <label for="anio">Año del vehículo</label>
        <input id="anio" type="number" class="form-control" th:field="*{anio}" required>

        <label for="color">Color</label>
        <input id="color" type="text" class="form-control" th:field="*{color}">

        <label for="idCliente">Cliente</label>
        <select id="idCliente" name="idCliente" class="form-control" required>
            
            <option value="">Seleccione un cliente</option>
            <option th:each="cliente : ${clientes}"
                    th:value="${cliente.id_cliente}"
                    th:text="${cliente.nombre}"
                    th:selected="${vehiculo.cliente != null and cliente.id_cliente == vehiculo.cliente.id_cliente}">
            </option>
        </select>

        <button class="btn btn-success" type="submit">Guardar</button>
    </form>

    <h2>Vehículos registrados</h2>
    <table class="table table-bordered-dark">
        <thead>
            <tr>
                <th>ID del vehículo</th>
                <th>Número de placa</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Año</th>
                <th>Color</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="vehiculo : ${vehiculos}">
                <td th:text="${vehiculo.id_vehiculo}"></td>
                <td th:text="${vehiculo.placa}"></td>
                <td th:text="${vehiculo.marca}"></td>
                <td th:text="${vehiculo.modelo}"></td>
                <td th:text="${vehiculo.anio}"></td>
                <td th:text="${vehiculo.color}"></td>

                <td>
                    <a class="btn btn-light" th:href="@{/vehiculos/editar/{id}(id=${vehiculo.id_vehiculo})}">Editar</a>
                    <form th:action="@{/vehiculos/eliminar/{id}(id=${vehiculo.id_vehiculo})}" method="post">
                        <button class="btn btn-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(vehiculos)}">
                <td colspan="7">No hay vehículos registrados.</td>
            </tr>
        </tbody>
    </table>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
