<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de repuestos</title>
</head>
<body>
    <h1>Registro de repuestos</h1>

    <p th:if="${mensaje}" th:text="${mensaje}" role="status"></p>
    <p th:if="${error}" th:text="${error}" role="alert"></p>

    <form th:action="@{/repuestos/guardar}" method="post">
        <label for="idRepuesto">ID del repuesto</label>
        <input id="idRepuesto" name="idRepuesto" type="number" th:value="${repuesto != null ? repuesto.id_repuesto : ''}" required>

        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" th:value="${repuesto != null ? repuesto.nombre : ''}" required>

        <label for="descripcion">Descripción</label>
        <input id="descripcion" name="descripcion" type="text" th:value="${repuesto != null ? repuesto.descripcion : ''}">

        <label for="precio">Precio</label>
        <input id="precio" name="precio" type="number" step="0.01" min="0" th:value="${repuesto != null ? repuesto.precio : ''}" required>

        <label for="existencia">Existencia</label>
        <input id="existencia" name="existencia" type="number" min="0" th:value="${repuesto != null ? repuesto.existencia : ''}" required>

        <label for="minimoEnStock">Mínimo en stock</label>
        <input id="minimoEnStock" name="minimoEnStock" type="number" min="0" th:value="${repuesto != null ? repuesto.minimo_en_stock : ''}" required>

        <button type="submit">Guardar</button>
    </form>

    <p>
        <a th:href="@{/repuestos}">Todos</a>
        <a th:href="@{/repuestos/agotados}">Agotados</a>
        <a th:href="@{/repuestos/bajo-inventario}">Bajo inventario</a>
        <a th:href="@{/repuestos/existencia-hasta-cinco}">Existencia hasta cinco</a>
    </p>

    <h2>Repuestos registrados</h2>
    <table>
        <thead>
            <tr>
                <th>ID del repuesto</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Existencia</th>
                <th>Mínimo en stock</th>
                <th>Abastecer</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="repuesto : ${repuestos}">
                <td th:text="${repuesto.id_repuesto}"></td>
                <td th:text="${repuesto.nombre}"></td>
                <td th:text="${repuesto.descripcion}"></td>
                <td th:text="${repuesto.precio}"></td>
                <td th:text="${repuesto.existencia}"></td>
                <td th:text="${repuesto.minimo_en_stock}"></td>
                <td>
                    <form th:action="@{/repuestos/abastecer/{id}(id=${repuesto.id_repuesto})}" method="post">
                        <label th:for="${'unidades-' + repuesto.id_repuesto}">Unidades</label>
                        <input th:id="${'unidades-' + repuesto.id_repuesto}" name="unidades" type="number" min="1" required>
                        <button type="submit">Abastecer</button>
                    </form>
                </td>
                <td>
                    <a th:href="@{/repuestos/editar/{id}(id=${repuesto.id_repuesto})}">Editar</a>
                    <form th:action="@{/repuestos/eliminar/{id}(id=${repuesto.id_repuesto})}" method="post">
                        <button type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(repuestos)}">
                <td colspan="8">No hay repuestos registrados.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
