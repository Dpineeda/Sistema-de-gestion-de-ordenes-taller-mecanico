<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background-image: linear-gradient(rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.82)),
                url("https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=1920&q=80");
            background-position: center;
            background-size: cover;
            background-attachment: fixed;   
        }
    </style>
    <title>Gestión de repuestos</title>
</head>
<body>
    <h1>Registro de repuestos</h1>

    <p th:if="${mensaje}" th:text="${mensaje}" role="status"></p>
    <p th:if="${error}" th:text="${error}" role="alert"></p>

    <form th:action="@{/repuestos/guardar}" method="post">
        <input type="hidden" name="idRepuesto" th:value="${repuesto != null ? repuesto.id_repuesto : 0}">

        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" class="form-control" th:value="${repuesto != null ? repuesto.nombre : ''}" required>

        <label for="descripcion">Descripción</label>
        <input id="descripcion" name="descripcion" type="text" class="form-control" th:value="${repuesto != null ? repuesto.descripcion : ''}" required>

        <label for="precio">Precio</label>
        <input id="precio" name="precio" type="number" class="form-control" step="0.01" min="0" th:value="${repuesto != null ? repuesto.precio : ''}" required>

        <label for="existencia">Existencia</label>
        <input id="existencia" name="existencia" type="number" class="form-control" min="0" th:value="${repuesto != null ? repuesto.existencia : ''}" required>

        <label for="minimoEnStock">Mínimo en stock</label>
        <input id="minimoEnStock" name="minimoEnStock" type="number" class="form-control" min="0" th:value="${repuesto != null ? repuesto.minimo_en_stock : ''}" required>

        <button class="btn btn-success" type="submit">Guardar</button>
    </form>

    <p>
        <a class="btn btn-light" th:href="@{/repuestos}">Todos</a>
        <a class="btn btn-light" th:href="@{/repuestos/agotados}">Agotados</a>
        <a class="btn btn-light" th:href="@{/repuestos/bajo-inventario}">Bajo inventario</a>
        <a class="btn btn-light" th:href="@{/repuestos/existencia-hasta-cinco}">Existencia hasta cinco</a>
    </p>

    <h2>Repuestos registrados</h2>
    <table class="table table-bordered-dark">
        <thead>
            <tr>
                <th>ID del repuesto</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Existencia</th>
                <th>Mínimo en stock</th>
                <th>Abastecer</th> 
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="repuesto : ${repuestos}">
                <td th:text="${repuesto.id_repuesto}"></td>
                <td th:text="${repuesto.nombre}"></td>
                <td th:text="${repuesto.descripcion}"></td>
                <td th:text="${repuesto.precio}"></td>
                <td th:text="${repuesto.existencia}"></td>
                <td th:text="${repuesto.minimo_en_stock}"></td>
                <td>
                    <form th:action="@{/repuestos/abastecer/{id}(id=${repuesto.id_repuesto})}" method="post">
                        <label th:for="${'unidades-' + repuesto.id_repuesto}">Unidades</label>
                        <input th:id="${'unidades-' + repuesto.id_repuesto}" name="unidades" type="number" class="form-control" min="1" required>
                        <button class="btn btn-success" type="submit">Abastecer</button>
                    </form>
                </td>
                <td>
                    <a class="btn btn-light" th:href="@{/repuestos/editar/{id}(id=${repuesto.id_repuesto})}">Editar</a>
                    <form th:action="@{/repuestos/eliminar/{id}(id=${repuesto.id_repuesto})}" method="post">
                        <button class="btn btn-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(repuestos)}">
                <td colspan="8">No hay repuestos registrados.</td>
            </tr>
        </tbody>
    </table>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
