<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background-image: linear-gradient(rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.82)),
                url("https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=1920&q=80");
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }
    </style>
    <title>Comprobantes</title>
</head>
<body>
    <h1>Comprobantes emitidos</h1>

    <p th:if="${mensaje}" th:text="${mensaje}" role="status"></p>
    <p th:if="${error}" th:text="${error}" role="alert"></p>

        <form th:action="@{/comprobantes/reportes/ingresos}" method="get">
            <label for="inicio">Desde</label>
            <input id="inicio" name="inicio" type="datetime-local" class="form-control" th:value="${inicio}" required>

        <label for="fin">Hasta (exclusivo)</label>
        <input id="fin" name="fin" type="datetime-local" class="form-control" th:value="${fin}" required>

        <button class="btn btn-success" type="submit">Consultar ingresos</button>
    </form>

    <p th:if="${comprobante}">
        Comprobante consultado:
        <span th:text="${comprobante.id_comprobante}"></span>
    </p>

    <table class="table table-bordered-dark">
        <thead>
            <tr>
                <th>ID del comprobante</th>
                <th>Fecha de emisión</th>
                <th>ID de la orden</th>
                <th>Total de repuestos</th>
                <th>Total</th>
                <th>Detalle</th>
            </tr>
        </thead>
             <tbody>
            <tr th:if="${comprobante}">
                <td th:text="${comprobante.id_comprobante}"></td>
                <td th:text="${comprobante.fecha_emision}"></td>
                <td th:text="${comprobante.orden != null ? comprobante.orden.id_orden : ''}"></td>
                <td th:text="${comprobante.total_repuesto}"></td>
                <td th:text="${comprobante.total}"></td>
                <td th:text="${comprobante.id_comprobante}"></td>
            </tr>
            
            <tr th:each="comprobante : ${comprobantes}">
                <td th:text="${comprobante.id_comprobante}"></td>
                <td th:text="${comprobante.fecha_emision}"></td>
                <td th:text="${comprobante.orden != null ? comprobante.orden.id_orden : ''}"></td>
                <td th:text="${comprobante.total_repuesto}"></td>
                <td th:text="${comprobante.total}"></td>
                <td><a class="btn btn-light" th:href="@{/comprobantes/{id}(id=${comprobante.id_comprobante})}">Consultar</a></td>
            </tr>
            <tr th:if="${comprobante == null and #lists.isEmpty(comprobantes)}">
                <td colspan="6">No hay comprobantes emitidos.</td>
            </tr>
        </tbody>
    </table>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
