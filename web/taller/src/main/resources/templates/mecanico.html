<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background-image: linear-gradient(rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.82)),
                url("https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=1920&q=80");
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }
    </style>
    <title>Gestión de mecánicos</title>
</head>
<body>
    <h1>Registro de mecánicos</h1>

    <p th:if="${mensaje}" th:text="${mensaje}" role="status"></p>
    <p th:if="${error}" th:text="${error}" role="alert"></p>

    <form th:action="@{/mecanicos/guardar}" method="post">
        <input type="hidden" name="id_mecanico" th:value="${mecanico != null ? mecanico.id_mecanico : 0}">

        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" class="form-control" th:value="${mecanico != null ? mecanico.nombre : ''}" required>

        <label for="telefono">Teléfono</label>
        <input id="telefono" name="telefono" type="text" class="form-control" th:value="${mecanico != null ? mecanico.telefono : ''}" required>

        <button class="btn btn-success" type="submit">Guardar</button>
    </form>

    <h2>Mecánicos registrados</h2>
    <table class="table table-bordered-dark">
        <thead>
            <tr>
                <th>ID del mecánico</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="mecanico : ${mecanicos}">
                <td th:text="${mecanico.id_mecanico}"></td>
                <td th:text="${mecanico.nombre}"></td>
                <td th:text="${mecanico.telefono}"></td>
                <td>
                    <a class="btn btn-light" th:href="@{/mecanicos/editar/{id}(id=${mecanico.id_mecanico})}">Editar</a>
                    <form th:action="@{/mecanicos/eliminar/{id}(id=${mecanico.id_mecanico})}" method="post">
                        <button class="btn btn-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(mecanicos)}">
                <td colspan="4">No hay mecánicos registrados.</td>
            </tr>
        </tbody>
    </table>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
