<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background-image: linear-gradient(rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.82)),
                url("https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=1920&q=80");
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }
    </style>
    <title>Servicios de órdenes</title>
</head>
<body>
    <h1>Asignación de servicios a órdenes</h1>

    <p th:if="${mensaje}" th:text="${mensaje}" role="status"></p>
    <p th:if="${error}" th:text="${error}" role="alert"></p>
    <p th:if="${orden}" th:text="${'Orden seleccionada: ' + orden.id_orden}"></p>

    <form th:action="@{/orden-servicios/guardar}" method="post">
        <label for="idOrden">Orden</label>
        <select id="idOrden" name="idOrden" class="form-control" required>
            <option value="">Seleccione una orden</option>
            <option th:each="opcion : ${ordenes}"
                    th:value="${opcion.id_orden}"
                    th:text="${'Orden ' + opcion.id_orden + ' - ' + opcion.estado}"
                    th:selected="${orden != null and orden.id_orden == opcion.id_orden}">
            </option>
        </select>

        <label for="idServicio">Servicio</label>
        <select id="idServicio" name="idServicio" class="form-control" required>
            <option value="">Seleccione un servicio</option>
            <option th:each="servicio : ${servicios}"
                    th:value="${servicio.id_servicio}"
                    th:text="${servicio.descripcion + ' - ' + servicio.costo_manodeobra}">
            </option>
        </select>

        <button class="btn btn-success" type="submit">Asignar servicio</button>
    </form>

    <h2>Servicios asignados</h2>
    <table class="table table-bordered-dark">
        <thead>
            <tr>
                <th>ID de la asignación</th>
                <th>Orden</th>
                <th>Servicio</th>
                <th>Costo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="asignacion : ${asignaciones}">
                <td th:text="${asignacion.id_orden_servicio}"></td>
                <td th:text="${asignacion.orden != null ? asignacion.orden.id_orden : ''}"></td>
                <td th:text="${asignacion.servicio != null ? asignacion.servicio.descripcion : ''}"></td>
                <td th:text="${asignacion.costo}"></td>
                <td>
                    <form th:action="@{/orden-servicios/eliminar/{id}(id=${asignacion.id_orden_servicio})}" method="post">
                        <button class="btn btn-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(asignaciones)}">
                <td colspan="5">No hay servicios asignados.</td>
            </tr>
        </tbody>
    </table>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
