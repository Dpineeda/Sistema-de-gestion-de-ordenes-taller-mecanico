<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background-image: linear-gradient(rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.82)),
                url("https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=1920&q=80");
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }
    </style>
    <title>Reporte de ingresos</title>
</head>
<body>
    <h1>Reporte de ingresos</h1>

    <p th:if="${mensaje}" th:text="${mensaje}" role="status"></p>
    <p th:if="${error}" th:text="${error}" role="alert"></p>
    <p th:if="${inicio}" th:text="${'Desde: ' + inicio}"></p>
    <p th:if="${fin}" th:text="${'Hasta: ' + fin}"></p>
    <p th:if="${ingresos != null}" th:text="${'Ingresos totales: ' + ingresos}"></p>
    <p th:if="${inicio != null and fin != null}">
        <a class="btn btn-light" th:href="@{/comprobantes/reportes/ingresos/pdf(inicio=${inicio},fin=${fin})}">Ver/descargar PDF</a>
    </p>

    <h2>Órdenes del periodo</h2>
    <table class="table table-bordered-dark">
        <thead>
            <tr>
                <th>ID de la orden</th>
                <th>Vehículo</th>
                <th>Mecánico</th>
                <th>Problema</th>
                <th>Estado</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="orden : ${ordenes}">
                <td th:text="${orden.id_orden}"></td>
                <td th:text="${orden.vehiculo != null ? orden.vehiculo.placa : ''}"></td>
                <td th:text="${orden.mecanico != null ? orden.mecanico.nombre : ''}"></td>
                <td th:text="${orden.descripcion_problema}"></td>
                <td th:text="${orden.estado}"></td>
                <td th:text="${orden.precio_total()}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(ordenes)}">
                <td colspan="6">No hay órdenes para mostrar en el periodo.</td>
            </tr>
        </tbody>
    </table>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
