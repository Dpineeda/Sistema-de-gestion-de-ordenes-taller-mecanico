<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background-image: linear-gradient(rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.82)),
                url("https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=1920&q=80");
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }
    </style>
    <title>Historial del vehículo</title>
</head>
<body>
    <h1>Historial del vehículo</h1>

    <p th:if="${mensaje}" th:text="${mensaje}" role="status"></p>
    <p th:if="${error}" th:text="${error}" role="alert"></p>

    <p th:if="${#strings.isEmpty(placa)}">Escribe la placa del vehículo para consultar las órdenes previas.</p>

    <form th:action="@{/vehiculos/historial}" method="get">
        <label for="placa">Número de placa</label>
        <input id="placa" name="placa" type="text" class="form-control" th:value="${placa != null ? placa : (vehiculo != null ? vehiculo.placa : '')}" required>
        <button class="btn btn-success" type="submit">Consultar historial</button>
    </form>

    <p th:if="${vehiculo}" th:text="${'Vehículo: ' + vehiculo.placa + ' - ' + vehiculo.marca + ' ' + vehiculo.modelo}"></p>

    <h2 th:if="${!#strings.isEmpty(placa)}" th:text="${'Historial de órdenes: ' + placa}"></h2>
    <p th:if="${!#strings.isEmpty(placa)}">
        <a class="btn btn-light" th:href="@{/vehiculos/historial/pdf(placa=${placa})}">Ver/descargar PDF</a>
    </p>
    <table class="table table-bordered-dark" th:if="${!#strings.isEmpty(placa)}">
        <thead>
            <tr>
                <th>ID de la orden</th>
                <th>Problema</th>
                <th>Mecánico</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="orden : ${ordenes}">
                <td th:text="${orden.id_orden}"></td>
                <td th:text="${orden.descripcion_problema}"></td>
                <td th:text="${orden.mecanico != null ? orden.mecanico.nombre : ''}"></td>
                <td th:text="${orden.estado}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(ordenes)}">
                <td colspan="4">No se encontraron órdenes para esta placa.</td>
            </tr>
        </tbody>
    </table>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
