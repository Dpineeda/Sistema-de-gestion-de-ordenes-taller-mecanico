<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de servicios</title>
</head>
<body>
    <h1>Registro de servicios</h1>

    <p th:if="${mensaje}" th:text="${mensaje}" role="status"></p>
    <p th:if="${error}" th:text="${error}" role="alert"></p>

    <form th:action="@{/servicios/guardar}" method="post">
        <label for="idServicio">ID del servicio</label>
        <input id="idServicio" name="idServicio" type="number" th:value="${servicio != null ? servicio.id_servicio : ''}" required>

        <label for="descripcion">Descripción</label>
        <input id="descripcion" name="descripcion" type="text" th:value="${servicio != null ? servicio.descripcion : ''}" required>

        <label for="costoManoObra">Costo de mano de obra</label>
        <input id="costoManoObra" name="costoManoObra" type="number" step="0.01" min="0" th:value="${servicio != null ? servicio.costo_manodeobra : ''}" required>

        <button type="submit">Guardar</button>
    </form>

    <h2>Servicios registrados</h2>
    <table>
        <thead>
            <tr>
                <th>ID del servicio</th>
                <th>Descripción</th>
                <th>Costo de mano de obra</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="servicio : ${servicios}">
                <td th:text="${servicio.id_servicio}"></td>
                <td th:text="${servicio.descripcion}"></td>
                <td th:text="${servicio.costo_manodeobra}"></td>
                <td>
                    <a th:href="@{/servicios/editar/{id}(id=${servicio.id_servicio})}">Editar</a>
                    <form th:action="@{/servicios/eliminar/{id}(id=${servicio.id_servicio})}" method="post">
                        <button type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(servicios)}">
                <td colspan="4">No hay servicios registrados.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
