<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background-image: linear-gradient(rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.82)),
                url("https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=1920&q=80");
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }
    </style>
    <title>Reporte de repuestos</title>
</head>
<body>
    <h1>Repuestos con existencia hasta cinco</h1>

    <p th:if="${mensaje}" th:text="${mensaje}" role="status"></p>
    <p th:if="${error}" th:text="${error}" role="alert"></p>
    <p><a class="btn btn-light" th:href="@{/repuestos/reporte/existencia-hasta-cinco/pdf}">Ver/descargar PDF</a></p>

    <table class="table table-bordered-dark">
        <thead>
            <tr>
                <th>ID del repuesto</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Existencia</th>
                <th>Mínimo en stock</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="repuesto : ${repuestos}">
                <td th:text="${repuesto.id_repuesto}"></td>
                <td th:text="${repuesto.nombre}"></td>
                <td th:text="${repuesto.descripcion}"></td>
                <td th:text="${repuesto.precio}"></td>
                <td th:text="${repuesto.existencia}"></td>
                <td th:text="${repuesto.minimo_en_stock}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(repuestos)}">
                <td colspan="6">No hay repuestos con existencia menor o igual a cinco.</td>
            </tr>
        </tbody>
    </table>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
